
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>城巡り | CASTLE JOURNEY</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

  <header>
    <h1>城巡り</h1>
    <p>CASTLE JOURNEY</p>
  </header>

  <main>

    <!-- 地図画面 -->
    <section id="map-page" class="page active">
      <h2>日本の城を巡ろう。</h2>
      <p>全国200城の訪問状況を地図で確認できます。</p>
      <div class="map-filters" role="group" aria-label="表示する城の区分">
        <label>
          <input type="checkbox" id="filter-100" value="日本100名城" checked>
          日本100名城
        </label>
        <label>
          <input type="checkbox" id="filter-zoku" value="続日本100名城" checked>
          続日本100名城
        </label>
      </div>
      <div class="map-layout">
        <div id="map"></div>
        <aside id="castle-detail" class="castle-detail" aria-labelledby="castle-detail-name" hidden>
          <div class="castle-detail-header">
            <h3 id="castle-detail-name" tabindex="-1"></h3>
            <button id="close-castle-detail" type="button">閉じる</button>
          </div>
          <dl>
            <dt>区分</dt>
            <dd id="castle-detail-category"></dd>
            <dt>公式番号</dt>
            <dd id="castle-detail-number"></dd>
            <dt>所在地</dt>
            <dd id="castle-detail-location"></dd>
          </dl>
          <label class="castle-visit-status">
            訪問状況
            <select id="castle-visit-status">
              <option value="unvisited">未訪問</option>
              <option value="visited">訪問済み</option>
            </select>
          </label>
        </aside>
      </div>
    </section>

    <!-- 城一覧画面 -->
    <section id="castle-page" class="page">
      <h2>城一覧</h2>
      <div class="castle-list-filters" role="group" aria-label="城一覧の絞り込み">
        <div>
          <label for="castle-search">城名</label>
          <input id="castle-search" type="search" placeholder="例：姫路城">
        </div>
        <div>
          <label for="castle-category-filter">区分</label>
          <select id="castle-category-filter">
            <option value="">すべて</option>
            <option>日本100名城</option>
            <option>続日本100名城</option>
          </select>
        </div>
        <div>
          <label for="castle-prefecture-filter">都道府県</label>
          <select id="castle-prefecture-filter">
            <option value="">すべて</option>
          </select>
        </div>
        <div>
          <label for="castle-status-filter">訪問状況</label>
          <select id="castle-status-filter">
            <option value="">すべて</option>
            <option value="visited">訪問済み</option>
            <option value="unvisited">未訪問</option>
          </select>
        </div>
      </div>

      <p id="castle-list-status" role="status">城データを読み込み中です。</p>
      <ul id="castle-list" class="castle-list"></ul>
      <template id="castle-list-item">
        <li class="castle-list-item">
          <div>
            <h3 class="castle-list-name"></h3>
            <p class="castle-list-location"></p>
            <p class="castle-list-category"></p>
          </div>
          <div class="castle-list-actions">
            <span class="castle-list-visit-status"></span>
            <button type="button">地図で見る</button>
          </div>
        </li>
      </template>
    </section>

    <!-- 記録画面 -->
    <section id="record-page" class="page">
      <h2>訪問記録</h2>
      <section class="castle-progress" aria-labelledby="castle-progress-title" hidden>
        <h3 id="castle-progress-title">訪問達成率</h3>
        <dl id="castle-progress"></dl>
        <div class="castle-progress-meter" aria-hidden="true">
          <span class="progress-100" id="progress-100"></span>
          <span class="progress-zoku" id="progress-zoku"></span>
          <span class="progress-unvisited" id="progress-unvisited"></span>
        </div>
        <ul class="castle-progress-legend" aria-label="メーターの凡例">
          <li><span class="progress-100" aria-hidden="true"></span>日本100名城・訪問済み</li>
          <li><span class="progress-zoku" aria-hidden="true"></span>続日本100名城・訪問済み</li>
          <li><span class="progress-unvisited" aria-hidden="true"></span>未訪問 <strong id="progress-unvisited-count"></strong></li>
        </ul>
      </section>
    </section>

    <!-- 設定画面 -->
    <section id="settings-page" class="page">
      <h2>設定</h2>
      <p>サイトの各種設定を管理します。</p>
    </section>

  </main>

  <!-- 下部ナビゲーション -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="map-page">
      <span>⌖</span>
      <small>地図</small>
    </button>

    <button class="nav-item" data-page="castle-page">
      <span>▤</span>
      <small>お城</small>
    </button>

    <button class="nav-item" data-page="record-page">
      <span>▥</span>
      <small>記録</small>
    </button>

    <button class="nav-item" data-page="settings-page">
      <span>⚙</span>
      <small>設定</small>
    </button>
  </nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>

</body>
</html>
